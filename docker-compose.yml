# docker compose up --build
#
# Runs the tuned proxy against two simulated providers (OpenAI and Anthropic
# wire formats), replays 1,000 concurrent chat sessions, kills the primary
# provider 45 s in, and prints the result. Watch it live in Grafana at
# http://localhost:3000 (dashboard "persona-chat-proxy").
#
# Baseline for comparison:  PROXY_MODE=baseline docker compose up --build
# Real providers instead:   set OPENAI_API_KEY / ANTHROPIC_API_KEY and the
#                           *_BASE_URL variables to the real endpoints.
x-image: &image
  build: .
  image: persona-chat-proxy:local

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  fake-openai:
    <<: *image
    entrypoint: ["/fakellm", "-addr", ":9001", "-name", "openai",
                 "-p429", "0.01", "-p5xx", "0.005", "-pstall-first", "0.003", "-pstall-mid", "0.005"]
    restart: "no" # it gets killed mid-run on purpose

  fake-anthropic:
    <<: *image
    entrypoint: ["/fakellm", "-addr", ":9002", "-name", "anthropic"]

  proxy:
    <<: *image
    entrypoint: ["/proxy", "-config", "/dev/null"]
    ports:
      - "8080:8080"
    environment:
      PROXY_MODE: ${PROXY_MODE:-tuned}
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: "${PROXY_MODE:-tuned}:"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-sim}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://fake-openai:9001/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-sim}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://fake-anthropic:9002/v1}
      RATE_LIMIT_TPS: "5"
      RATE_LIMIT_BURST: "20"
      BUDGET_SOFT_TOKENS: ${BUDGET_SOFT_TOKENS:-50000000} # high for the benchmark; see config.example.yaml
      BUDGET_HARD_TOKENS: ${BUDGET_HARD_TOKENS:-60000000}
    depends_on:
      redis:
        condition: service_healthy
      fake-openai:
        condition: service_started
      fake-anthropic:
        condition: service_started

  loadgen:
    <<: *image
    entrypoint: ["/loadgen", "-proxy", "http://proxy:8080", "-label", "${PROXY_MODE:-tuned}",
                 "-sessions", "${SESSIONS:-1000}", "-kill-url", "http://fake-openai:9001/admin/kill",
                 "-kill-after", "45s", "-out", "/results/${PROXY_MODE:-tuned}.json"]
    volumes:
      - ./bench/results:/results
    depends_on:
      - proxy
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/persona-chat.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
