name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "Run gofmt on:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # A short version of the benchmark: the tuned proxy must not drop a single
  # stream when the primary provider is killed mid-run.
  bench-smoke:
    needs: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: SESSIONS=100 KILL_AFTER=10s bench/run.sh
      - name: Zero dropped streams in tuned mode
        run: |
          dropped=$(jq .dropped_streams bench/results/tuned.json)
          corrupt=$(jq .corrupt_replies bench/results/tuned.json)
          echo "tuned: dropped=$dropped corrupt=$corrupt"
          [ "$dropped" = 0 ] && [ "$corrupt" = 0 ]
      - run: cat bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t persona-chat-proxy:ci .
      - run: docker compose config --quiet
